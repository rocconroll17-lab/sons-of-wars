        <tr><td>Mercato</td><td>Dall\u2019Et\xE0 Feudale (175 legna): compra o vende cibo, legna e pietra contro oro a lotti di 100. Prezzi comuni a tutte le fazioni: chi compra li alza, chi vende li abbassa (vendendo si incassa il 70%), poi tornano lentamente a 100</td></tr>
        <tr><td>Molo e arsenale</td><td>Molo fluviale (100 legna): sul fiume o sulla costa, vara pescherecci, trasporti e mercantili, deposito di cibo, legna e ferro. Arsenale costiero (Et\xE0 dei Castelli, 300 legna e 150 pietra): solo su acqua profonda, vara galee e galeoni (non pi\xF9 il porto) e ripara le navi vicine</td></tr>

        <tr><td>Villaggio conteso</td><td>Variante di I Due Valichi: il Borgo del Lago sul giro nord. Chi lo presidia da solo con le truppe lo usa come deposito e vi cura le unit\xE0 (pagando cibo); se ci sono entrambi, i servizi si sospendono. Con \xABControllo del territorio\xBB vince chi lo tiene 5 minuti di fila</td></tr>
        <tr><td>Rivalit\xE0</td><td>Variante della foce: la Rocca del Guado e la Marca dei Cavalieri, alleate contro di te, si combattono anche fra loro per l\u2019oro della frontiera fra i fiumi (dal 12\xB0 minuto). Linea tratteggiata e \u2694 sulla minimappa, riga nel riquadro dei villaggi</td></tr>
        <tr><td>Resa offerta</td><td>Variante della foce: un villaggio senza esercito, con le tue truppe davanti al centro per 60 secondi, offre la resa. La accetti dal riquadro dei villaggi: \xE8 neutralizzato e ti paga il 25% delle sue scorte</td></tr>
        <tr><td>Insediamento di frontiera</td><td>Dall\u2019Et\xE0 dei Castelli l\u2019avamposto costruito su un villaggio neutralizzato si trasforma (scheda Evolvi: 150 legna, 75 pietra, 60 s) e addestra popolani: costo come al centro citt\xE0, tempo +50%, una coda, punto di raccolta con clic destro. Non d\xE0 alloggi</td></tr>
        <tr><td>Inseguimenti</td><td>Le truppe che ingaggiano da sole non inseguono oltre 12 caselle e poi tornano al loro posto (o riprendono la marcia). Un bersaglio irraggiungibile d\xE0 un avviso: aspettano al punto pi\xF9 vicino e riprovano appena si apre un passaggio</td></tr>
        <tr><td>Mac</td><td>Clic destro = clic con due dita sul trackpad oppure Ctrl + clic</td></tr>
        <tr><td>Doppio clic</td><td>Seleziona tutte le unit\xE0 dello stesso tipo sullo schermo</td></tr>
        <tr><td>Maiusc + clic</td><td>Aggiunge/toglie dalla selezione; mantiene il piazzamento degli edifici</td></tr>
        <tr><td>Clic destro</td><td>Ordine contestuale: muovi, raccogli, attacca, costruisci; sugli edifici imposta il punto di raccolta</td></tr>
        <tr><td>Q W E R T \xB7 A S D F G \xB7 Z X C V B</td><td>Pulsanti del pannello comandi (griglia)</td></tr>
        <tr><td>Tieni premuto il tasto sinistro e muovi il mouse \xB7 frecce \xB7 bordo schermo \xB7 minimappa</td><td>Scorri la mappa (trackpad: due dita) \xB7 rotellina o pizzico: zoom</td></tr>
        <tr><td>Ctrl + 1\u20269 / 1\u20269</td><td>Crea / richiama un gruppo (doppio: centra). Su touch: \xAB\u{1F465} Gruppi\xBB, poi \xAB\u{1F4BE} Salva\xBB e un numero</td></tr>
        <tr><td>H</td><td>Seleziona il centro citt\xE0</td></tr>
        <tr><td>V (con truppe selezionate)</td><td>Mantieni posizione: colpiscono solo entro gittata, non inseguono n\xE9 accorrono; un nuovo ordine la annulla</td></tr>
        <tr><td>Porta nelle mura</td><td>Seleziona un tratto di mura tuo: pulsante \xABPorta\xBB. Le tue unit\xE0 la attraversano, i nemici devono aggirarla o abbatterla</td></tr>
        <tr><td>. (punto) \xB7 , (virgola)</td><td>Popolano inattivo successivo \xB7 tutti i militari inattivi (anche dalla barra in alto)</td></tr>
        <tr><td>Pianta un albero (scheda Economia)</td><td>Caselle verdi: clic destro per confermare (Maiusc per continuare, su una piantina in attesa la annulla), Esc per uscire. Su touch: tocca la casella e Conferma</td></tr>
        <tr><td>Canc (\u232B su Mac), due volte</td><td>Demolisce gli edifici selezionati: recuperi met\xE0 del costo (meno se danneggiati); il centro citt\xE0 non si demolisce</td></tr>
        <tr><td>A / S (truppe selezionate)</td><td>Formazione in linea (mischia davanti, tiratori dietro) / in colonna (per le strettoie); di nuovo per il movimento libero</td></tr>
        <tr><td>Maiusc + clic destro</td><td>Accoda l\u2019ordine (tappe, costruisci e poi raccogli, tappe navali); un ordine senza Maiusc sostituisce la coda</td></tr>
        <tr><td>Maiusc + addestra</td><td>Accoda 5 unit\xE0</td></tr>
        <tr><td>Doppio clic su un edificio</td><td>Seleziona tutti quelli dello stesso tipo: gli ordini vanno alla coda pi\xF9 corta</td></tr>
        <tr><td>Barra spaziatrice</td><td>Vai all\u2019ultimo attacco subito</td></tr>
